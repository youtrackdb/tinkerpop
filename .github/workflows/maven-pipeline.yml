name: Test And Deployment Pipeline
on:
  workflow_dispatch:
  push:
    branches: [ "ytdb-fork-3.8-dev", "3.8-dev"]
  pull_request:
    branches: [ "ytdb-fork-3.8-dev" ]
env:
  MODULES: ':gremlin-core,:gremlin-driver,:gremlin-server,:gremlin-test,:gremlin-console'
jobs:
  test:
    name: Test on ${{ matrix.platform.os }} - JDK ${{ matrix.java }} (${{ matrix.distribution }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        java: [ '17' ]
        distribution: [ 'temurin' ]
        platform:
          - os: ubuntu-latest
            arch: x64
            mvn_opts: '-Dmaven.test.failure.ignore=true'
          - os: ubuntu-24.04-arm
            arch: arm64
            mvn_opts: '-Dmaven.test.failure.ignore=true'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.java }} (${{ matrix.distribution }})
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: ${{ matrix.distribution }}
          architecture: ${{ matrix.platform.arch }}
          cache: 'maven'
          overwrite-settings: false

      - name: Run Maven Tests
        run: mvn -s .github/workflows/settings.xml -am -pl ${{ env.MODULES }} clean package -B ${{ matrix.platform.mvn_opts }}
        env:
          MAVEN_MIROR_USERNAME: ${{ secrets.MAVEN_MIROR_USERNAME }}
          MAVEN_MIROR_PASSWORD: ${{ secrets.MAVEN_MIROR_PASSWORD }}
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
          action_fail: true
          large_files: true
          comment_mode: off
          check_name: Tests Results (${{ matrix.platform.os }}, JDK ${{ matrix.java }}, ${{ matrix.distribution }})
  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Deploy on push to ytdb-fork-3.8-dev, or on a manual run triggered from that branch.
    # The event is matched explicitly so that pull_request (and any future merge_group)
    # runs can never deploy.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref_name == 'ytdb-fork-3.8-dev'
    env:
      MAVEN_DEPLOY_REPO: "central::https://oss.sonatype.org/content/repositories/snapshots"
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6

      - name: Set Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up JDK 17 settings
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          overwrite-settings: false

      - name: Maven deploy
        # Deploy to Maven Central as SNAPSHOT
        run: mvn -s .github/workflows/settings.xml -Dsha1=-${{ steps.vars.outputs.sha_short }} -DaltDeploymentRepository=${{ env.MAVEN_DEPLOY_REPO }} clean deploy -am -pl ${{ env.MODULES}} -DskipTests -B
        env:
          # Credentials mapped to environment variables
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_MIROR_USERNAME: ${{ secrets.MAVEN_MIROR_USERNAME }}
          MAVEN_MIROR_PASSWORD: ${{ secrets.MAVEN_MIROR_PASSWORD }}

      - name: Get Version and Create Annotation
        run: |
          VERSION=$(mvn -N -s .github/workflows/settings.xml help:evaluate -Dexpression=project.version -q -DforceStdout -Dsha1=-${{ steps.vars.outputs.sha_short }})
          echo "Published version: $VERSION"
          echo "::notice title=Published Maven Artifacts::Version: $VERSION"
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_MIROR_USERNAME: ${{ secrets.MAVEN_MIROR_USERNAME }}
          MAVEN_MIROR_PASSWORD: ${{ secrets.MAVEN_MIROR_PASSWORD }}
  notify-failure:
    name: Notify build failure on Zulip
    needs: [ test, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Determine Branch Name
        id: branch_name
        run: |
          if [[ "${{ github.event_name }}" == "merge_group" ]]; then
            echo "branch=${{ github.event.merge_group.head_ref }}" >> $GITHUB_OUTPUT
          else
            echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi
      - name: Send Zulip notification
        uses: zulip/github-actions-zulip/send-message@v1
        with:
          api-key: ${{ secrets.ZULIP_API_KEY }}
          email: ci-status-bot@youtrackdb.zulipchat.com
          organization-url: 'https://youtrackdb.zulipchat.com'
          to: 'ytdb'
          type: 'stream'
          topic: 'ci status'
          content: |
            **BUILD FAILED** :rotating_light:
            Workflow: `${{ github.workflow }}`
            Build failed on branch `${{ steps.branch_name.outputs.branch }}` for commit ${{ github.sha }} for repo ${{ github.repository }}.
            [View Run Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
  notify-fixed:
    name: Notify build fixed on Zulip
    needs: [ test, deploy]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6

      - name: Determine Branch Name
        id: branch_name
        run: |
          if [[ "${{ github.event_name }}" == "merge_group" ]]; then
            echo "branch=${{ github.event.merge_group.head_ref }}" >> $GITHUB_OUTPUT
          else
            echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Get Previous Run Status
        id: previous_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_conclusion=$(gh run list \
            --repo "${{ github.repository }}" \
            --branch "${{ steps.branch_name.outputs.branch }}" \
            --workflow "${{ github.workflow }}" \
            --limit 2 \
            --json conclusion \
            --jq '.[1].conclusion')
          echo "previous_conclusion=$previous_conclusion" >> $GITHUB_OUTPUT

      - name: Send Zulip notification
        if: steps.previous_run.outputs.previous_conclusion == 'failure'
        uses: zulip/github-actions-zulip/send-message@v1
        with:
          api-key: ${{ secrets.ZULIP_API_KEY }}
          email: ci-status-bot@youtrackdb.zulipchat.com
          organization-url: 'https://youtrackdb.zulipchat.com'
          to: 'ytdb'
          type: 'stream'
          topic: 'ci status'
          content: |
            **BUILD FIXED** :white_check_mark:
            Workflow: `${{ github.workflow }}`
            Build fixed on branch `${{ steps.branch_name.outputs.branch }}` for commit ${{ github.sha }} for repo ${{ github.repository }}.
            [View Run Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})