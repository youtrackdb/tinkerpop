name: Sync with Upstream

on:
  schedule:
    - cron: '0 0 * * *' # Run every day at midnight
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream repository (e.g. apache/tinkerpop)'
        required: true
        default: 'apache/tinkerpop'
      upstream_branch:
        description: 'Upstream branch to sync from (e.g. 3.8-dev)'
        required: true
        default: '3.8-dev'
      target_branch:
        description: 'Target branch to sync to (e.g. ytdb-fork-3.8-dev)'
        required: true
        default: 'ytdb-fork-3.8-dev'

env:
  # Define defaults here for schedule trigger where inputs are empty
  UPSTREAM_REPO: ${{ inputs.upstream_repo || 'apache/tinkerpop' }}
  UPSTREAM_BRANCH: ${{ inputs.upstream_branch || '3.8-dev' }}
  TARGET_BRANCH: ${{ inputs.target_branch || 'ytdb-fork-3.8-dev' }}
  MODULES: ':gremlin-core,:gremlin-driver,:gremlin-server,:gremlin-test,:gremlin-console'

jobs:
  sync-and-test:
    name: Sync ${{ inputs.upstream_repo || 'apache/tinkerpop' }}/${{ inputs.upstream_branch || '3.8-dev' }} to ${{ inputs.target_branch || 'ytdb-fork-3.8-dev' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Target Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0 # Fetch all history for merging

      - name: Configure Git
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

      - name: Add Upstream Remote and Fetch
        run: |
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git || git remote set-url upstream https://github.com/${{ env.UPSTREAM_REPO }}.git
          git fetch upstream ${{ env.UPSTREAM_BRANCH }}

      - name: Merge Upstream Changes
        run: |
          echo "Merging upstream/${{ env.UPSTREAM_BRANCH }} into ${{ env.TARGET_BRANCH }}..."
          git merge upstream/${{ env.UPSTREAM_BRANCH }} --no-edit

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Tests
        # Using the same test command structure as the main pipeline
        run: mvn -s .github/workflows/settings.xml -am -pl ${{ env.MODULES }} clean package -B
        env:
          MAVEN_MIROR_USERNAME: ${{ secrets.MAVEN_MIROR_USERNAME }}
          MAVEN_MIROR_PASSWORD: ${{ secrets.MAVEN_MIROR_PASSWORD }}

      - name: Push Changes to Fork
        if: success()
        run: |
          git push origin ${{ env.TARGET_BRANCH }}
