name: Sync with Upstream

on:
  schedule:
    - cron: '0 0 * * 0' # Run every Sunday at midnight
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream repository (e.g. apache/tinkerpop)'
        required: true
        default: 'apache/tinkerpop'
      upstream_branch:
        description: 'Upstream branch to sync from (e.g. 3.8-dev)'
        required: true
        default: '3.8-dev'
      target_branch:
        description: 'Target branch to sync to (e.g. ytdb-fork-3.8-dev)'
        required: true
        default: 'ytdb-fork-3.8-dev'

env:
  # Define defaults here for schedule trigger where inputs are empty
  UPSTREAM_REPO: ${{ inputs.upstream_repo || 'apache/tinkerpop' }}
  UPSTREAM_BRANCH: ${{ inputs.upstream_branch || '3.8-dev' }}
  TARGET_BRANCH: ${{ inputs.target_branch || 'ytdb-fork-3.8-dev' }}
  MODULES: ':gremlin-core,:gremlin-driver,:gremlin-server,:gremlin-test,:gremlin-console'

jobs:
  test:
    name: Test on ${{ matrix.platform.os }} - JDK ${{ matrix.java }} (${{ matrix.distribution }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        java: [ '17' ]
        distribution: [ 'temurin', 'corretto', 'oracle', 'zulu', 'microsoft']
        platform:
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout Target Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0 # Fetch all history for merging

      - name: Configure Git
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

      - name: Add Upstream Remote and Fetch
        run: |
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git || git remote set-url upstream https://github.com/${{ env.UPSTREAM_REPO }}.git
          git fetch upstream ${{ env.UPSTREAM_BRANCH }}

      - name: Merge Upstream Changes
        run: |
          echo "Merging upstream/${{ env.UPSTREAM_BRANCH }} into ${{ env.TARGET_BRANCH }}"...
          git merge upstream/${{ env.UPSTREAM_BRANCH }} --no-edit

      - name: Set up JDK ${{ matrix.java }} (${{ matrix.distribution }})
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: ${{ matrix.distribution }}
          architecture: ${{ matrix.platform.arch }}
          cache: 'maven'

      - name: Run Maven Tests
        # We purposely omit ${{ matrix.platform.mvn_opts }} which typically ignores failures,
        # because we want the job to fail (and stop the sync) if tests fail.
        run: mvn -s .github/workflows/settings.xml -am -pl ${{ env.MODULES }} clean package -B
        env:
          MAVEN_MIROR_USERNAME: ${{ secrets.MAVEN_MIROR_USERNAME }}
          MAVEN_MIROR_PASSWORD: ${{ secrets.MAVEN_MIROR_PASSWORD }}

  sync:
    name: Sync to Fork
    needs: test
    runs-on: ubuntu-latest
    if: success() # Only run if all test jobs passed
    steps:
      - name: Checkout Target Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

      - name: Add Upstream Remote and Fetch
        run: |
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git || git remote set-url upstream https://github.com/${{ env.UPSTREAM_REPO }}.git
          git fetch upstream ${{ env.UPSTREAM_BRANCH }}

      - name: Merge Upstream Changes
        run: |
          echo "Merging upstream/${{ env.UPSTREAM_BRANCH }} into ${{ env.TARGET_BRANCH }}"...
          git merge upstream/${{ env.UPSTREAM_BRANCH }} --no-edit

      - name: Push Changes to Fork
        run: |
          git push origin ${{ env.TARGET_BRANCH }}

  notify-failure:
    name: Notify build failure on Zulip
    needs: [test, sync]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6

      - name: Determine Branch Name
        id: branch_name
        run: |
           echo "branch=${{ env.TARGET_BRANCH }}" >> $GITHUB_OUTPUT

      - name: Send Zulip notification
        uses: zulip/github-actions-zulip/send-message@v1
        with:
          api-key: ${{ secrets.ZULIP_API_KEY }}
          email: ci-status-bot@youtrackdb.zulipchat.com
          organization-url: 'https://youtrackdb.zulipchat.com'
          to: 'ytdb'
          type: 'stream'
          topic: 'ci status'
          content: |
            **BUILD FAILED** :rotating_light:
            Build failed on branch `${{ steps.branch_name.outputs.branch }}` for commit ${{ github.sha }} for repo ${{ github.repository }}.
            [View Run Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

  notify-fixed:
    name: Notify build fixed on Zulip
    needs: [test, sync]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6

      - name: Determine Branch Name
        id: branch_name
        run: |
           echo "branch=${{ env.TARGET_BRANCH }}" >> $GITHUB_OUTPUT

      - name: Get Previous Run Status
        id: previous_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_conclusion=$(gh run list \
            --repo "${{ github.repository }}" \
            --branch "${{ steps.branch_name.outputs.branch }}" \
            --workflow "${{ github.workflow }}" \
            --limit 2 \
            --json conclusion \
            --jq '.[1].conclusion')
          echo "previous_conclusion=$previous_conclusion" >> $GITHUB_OUTPUT

      - name: Send Zulip notification
        if: steps.previous_run.outputs.previous_conclusion == 'failure'
        uses: zulip/github-actions-zulip/send-message@v1
        with:
          api-key: ${{ secrets.ZULIP_API_KEY }}
          email: ci-status-bot@youtrackdb.zulipchat.com
          organization-url: 'https://youtrackdb.zulipchat.com'
          to: 'ytdb'
          type: 'stream'
          topic: 'ci status'
          content: |
            **BUILD FIXED** :white_check_mark:
            Build fixed on branch `${{ steps.branch_name.outputs.branch }}` for commit ${{ github.sha }} for repo ${{ github.repository }}.
            [View Run Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
